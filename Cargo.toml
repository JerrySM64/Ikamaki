[package]
name = "ikamaki"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
roead = { version = "1.0", default-features = false, features = ["byml", "yaml"] }

[lints.clippy]
print_stdout = { level = "deny", priority = 1}
pedantic = { level = "warn", priority = 0 }
all = { level = "warn", priority = -1 }
